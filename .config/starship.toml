"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#8aa6f7)[  $directory]($style_dir)[](bg:#232436 fg:#8aa6f7)$git_branch$git_status[](fg:#232436)
$character"""

add_newline = true

[directory]
style = "bg:#8aa6f7 fg:#14141f bold"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style_dir = "bg:#8aa6f7 fg:#14141f"
style = "bg:#232436 fg:#c8cbe0"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#232436 fg:#e8c48a"
format = '[$all_status$ahead_behind ]($style)'

[character]
success_symbol = "[❯](bold #9fd9a8)"
error_symbol = "[❯](bold #e37c88)"
vicmd_symbol = "[❮](bold #8aa6f7)"

[cmd_duration]
min_time = 2000
format = "took [$duration](#9699b8) "

[nodejs]
symbol = " "
format = "[$symbol($version )](#9fd9a8)"

[python]
symbol = " "
format = "[$symbol($version )](#e8c48a)"

[rust]
symbol = " "
format = "[$symbol($version )](#eab087)"
