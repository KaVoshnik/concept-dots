#
# hyprland.conf — main entrypoint
# part of "concept" dotfiles — https://github.com/YOURNAME/concept-dots

# ────────────────────────────────
#  Sources
# ────────────────────────────────
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf

# ────────────────────────────────
#  Autostart
# ────────────────────────────────
exec-once = waybar
exec-once = ~/.config/concept-dots/scripts/init-wallpaper.sh
exec-once = hypridle
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator
exec-once = qs -c concept-panel
exec-once = fastfetch # remove if you don't want a terminal-splash habit

# ────────────────────────────────
#  Environment
# ────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,22
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = GTK_THEME,adw-gtk3-dark

# ────────────────────────────────
#  Input
# ────────────────────────────────
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

# ────────────────────────────────
#  General look (minimal, muted)
# ────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = $lavender
    col.inactive_border = $surface1
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }

    active_opacity = 1.0
    inactive_opacity = 0.94
}

animations {
    enabled = true

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 8, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 5, overshot, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ────────────────────────────────
#  Workspace ↔ monitor rules, per-app rules → windowrules.conf
# ────────────────────────────────
