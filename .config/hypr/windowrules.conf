# ────────────────────────────────
#  Per-app window rules
#  Syntax (Hyprland 0.53+): windowrule = <effect>, match:<field> <value>
# ────────────────────────────────
windowrule = float true, match:class ^(pavucontrol)$
windowrule = float true, match:class ^(nm-connection-editor)$
windowrule = float true, match:class ^(blueman-manager)$
windowrule = float true, match:title ^(Picture-in-Picture)$
windowrule = pin true, match:title ^(Picture-in-Picture)$
windowrule = opacity 1.0 override, match:class ^(mpv)$

# NOTE: the "idleinhibit" windowrule was removed in Hyprland 0.53.
# Fullscreen-aware idle inhibition is now handled by hypridle itself —
# see hypridle.conf if you need per-app idle behavior.

# ────────────────────────────────
#  Layer rules (blur, notifications, etc.)
#  Syntax (Hyprland 0.53+): block form
# ────────────────────────────────
layerrule {
    name = waybar_blur
    match:namespace = waybar
    blur = true
    ignore_alpha = true
}

layerrule {
    name = rofi_blur
    match:namespace = rofi
    blur = true
    ignore_alpha = true
}

layerrule {
    name = notifications_blur
    match:namespace = notifications
    blur = true
    ignore_alpha = true
}
